{% extends "base.html" %}
{% block title %}Données principales{% endblock %}

{% block content %}
<h1>Données principales — 300 dernières mesures</h1>

<div class="card">
    <p class="card-title">Température (°C)</p>
    <div class="chart-container">
        <canvas id="chartTemp"></canvas>
    </div>
</div>

<div class="card">
    <p class="card-title">Humidité (%)</p>
    <div class="chart-container">
        <canvas id="chartHum"></canvas>
    </div>
</div>

<div class="card">
    <p class="card-title">Poids (g)</p>
    <div class="chart-container">
        <canvas id="chartPoids"></canvas>
    </div>
</div>

<div class="card">
    <p class="card-title">État de charge batterie — SoC (%)</p>
    <div class="chart-container">
        <canvas id="chartSoc"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const labels       = {{ labels | safe }};
    const temperatures = {{ temperatures | safe }};
    const humidites    = {{ humidites | safe }};
    const poids        = {{ poids | safe }};
    const soc          = {{ soc | safe }};

    function makeOptions(min, max) {
        return {
            responsive: true,
            maintainAspectRatio: false,
            spanGaps: false,
            plugins: { legend: { display: false } },
            elements: {
                point: { radius: 0 },
                line:  { tension: 0.3, borderWidth: 2 }
            },
            scales: {
                x: {
                    ticks: { maxTicksLimit: 10, color: '#95A5A6', font: { size: 11 } },
                    grid: { color: '#F0F2F5' }
                },
                y: {
                    min: min,
                    max: max,
                    ticks: { color: '#95A5A6', font: { size: 11 } },
                    grid: { color: '#F0F2F5' }
                }
            }
        };
    }

    new Chart(document.getElementById('chartTemp'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                data: temperatures,
                borderColor: '#E74C3C',
                backgroundColor: 'rgba(231,76,60,0.08)',
                fill: true
            }]
        },
        options: makeOptions(-10, 30)
    });

    new Chart(document.getElementById('chartHum'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                data: humidites,
                borderColor: '#3498DB',
                backgroundColor: 'rgba(52,152,219,0.08)',
                fill: true
            }]
        },
        options: makeOptions(0, 100)
    });

    new Chart(document.getElementById('chartPoids'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                data: poids,
                borderColor: '#27AE60',
                backgroundColor: 'rgba(39,174,96,0.08)',
                fill: true
            }]
        },
        options: makeOptions(0, 1500)
    });

    new Chart(document.getElementById('chartSoc'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                data: soc,
                borderColor: '#E67E22',
                backgroundColor: 'rgba(230,126,34,0.08)',
                fill: true
            }]
        },
        options: makeOptions(0, 100)
    });
</script>
{% endblock %}
